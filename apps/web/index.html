<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DT Academy</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      .boot-splash {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1a2b3c;
        color: #fff;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot-splash__mark {
        position: relative;
        display: flex;
        height: 4rem;
        width: 4rem;
        align-items: center;
        justify-content: center;
      }
      .boot-splash__ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff;
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-splash__cap {
        display: flex;
        height: 2.75rem;
        width: 2.75rem;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: #fff;
        color: #1a2b3c;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .boot-splash__title {
        margin: 1.5rem 0 0;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      .boot-splash__hint {
        margin-top: 0.5rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash__mark">
          <span class="boot-splash__ring"></span>
          <span class="boot-splash__cap">DT</span>
        </div>
        <p class="boot-splash__title">DT Academy</p>
        <p class="boot-splash__hint">Opening the school site</p>
      </div>
    </div>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
